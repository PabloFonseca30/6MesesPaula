<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/entry.css">
    <link rel="stylesheet" href="css/cuadro.css">
    <link rel="stylesheet" href="css/unlocked.css">
    <link rel="stylesheet" href="css/crono.css">
    <script src="js/entry.js" type="module" defer></script>
    <link rel="icon" type="image/png" href="sources/corazon.png" draggable="false">
    <title>6 Meses Juntos</title>
</head>
<body>
    <div id="container">
        <div class="tittle_cuadro" id="tittle_cuadro">
            <p id="tittle_1">♡ Resuelve nuestra foto ♡</p>
            <p id="tittle_2">Selecciona dos casilas para intercambiarlas. La página se desbloquea cuando se complete la imagen.</p>
        </div>
        <div class="code_box" id="code_box">
            <div class="deco">
                <img class="heart" src="sources/heart.png" alt="delete" draggable="false">
                <div class="dot_box">
                    <div id="d1" class="dot"></div>
                    <div id="d2" class="dot"></div>
                    <div id="d3" class="dot"></div>
                    <div id="d4" class="dot"></div>
                </div>
            </div>
            <div class="fila">
                <div id="n1" class="casilla">1</div>
                <div id="n2" class="casilla">2</div>
                <div id="n3" class="casilla">3</div>
            </div>
            <div class="fila">
                <div id="n4" class="casilla">4</div>
                <div id="n5"class="casilla" >5</div>
                <div id="n6" class="casilla">6</div>
            </div>
            <div class="fila">
                <div id="n7" class="casilla">7</div>
                <div id="n8" class="casilla">8</div>
                <div id="n9" class="casilla">9</div>
            </div>
            <div class="fila">
                <div id="nPista" class="casilla">
                    <img class="pista" src="sources/pista.png" alt="delete" draggable="false">
                </div>
                <div id="n0" class="casilla">0</div>
                <div id="nDel" class="casilla">
                    <img class="delete" src="sources/delete.png" alt="delete" draggable="false">
                </div>
            </div>
            <div class="pista_box" id="pista_box">
                <p>"El dia y mes de una fecha muy especial"</p>
            </div>
        </div>
        <div class="next_btn" id="next_btn">
            <img class="flecha" src="sources/flecha.png" alt="flecha" draggable="false">
        </div>

        <div id="capa_transicion"></div>
    </div>

    <!--Contenedor bloqueado-->
    <div id="unlocked_container">
        <!---->
    </div>

    <!--Contenedor bloqueado 2-->
    <div id="unlocked_container_2">
        <!---->
    </div>
</body>
</html>
